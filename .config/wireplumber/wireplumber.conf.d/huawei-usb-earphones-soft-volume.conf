## Huawei USB-C earphones (Yichip USB-Audio-1.0) ignore their own hardware
## volume control: with the 'PCM' mixer at 0/255 they still play at full
## level, so the volume slider did nothing. Use PipeWire's software volume
## for this card instead; the hardware mixer is left at maximum.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.usb-Yichip_USB-Audio-1.0-00"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
