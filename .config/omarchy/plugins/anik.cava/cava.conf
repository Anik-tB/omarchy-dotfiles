# cava feed for the Anik bar visualizer (raw ascii, read by Widget.qml)
[general]
framerate = 60
bars = 12
autosens = 1
lower_cutoff_freq = 40
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
monstercat = 1
